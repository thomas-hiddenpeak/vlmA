name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*.*.*'  # 当推送版本标签时触发
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Building version $VERSION"
        # Update package.json version
        npm version $VERSION --no-git-tag-version --allow-same-version
    
    - name: Pre-build verification
      shell: bash
      run: |
        echo "=== Checking server directory before build ==="
        ls -la server/ || echo "Server directory not found"
        echo ""
        echo "=== Installing server dependencies manually ==="
        cd server
        npm ci --only=production
        cd ..
        echo ""
        echo "=== Verifying server/node_modules ==="
        ls -la server/node_modules/ | head -20 || echo "node_modules not found"
        echo ""
        echo "=== Checking critical dependencies ==="
        ls server/node_modules/ | grep -E "express|axios|multer|cors" || echo "Critical dependencies missing"
      
    - name: Build Electron app
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Verify build output
      shell: bash
      run: |
        echo "=== Build output structure ==="
        ls -la dist/ || echo "dist directory not found"
        echo ""
        echo "=== Detailed verification by platform ==="
        
        if [ "${{ runner.os }}" = "macOS" ]; then
          echo ">>> macOS build verification <<<"
          if [ -d "dist/mac-arm64" ]; then
            echo "ARM64 app found"
            APP_PATH="dist/mac-arm64/RMinte 多模态分析引擎.app/Contents/Resources/server"
            if [ -d "$APP_PATH" ]; then
              echo "✓ Server directory exists"
              ls -la "$APP_PATH/" | head -10
              if [ -d "$APP_PATH/node_modules" ]; then
                echo "✓ node_modules exists"
                ls "$APP_PATH/node_modules/" | head -20
                echo "✓ Critical dependencies check:"
                ls "$APP_PATH/node_modules/" | grep -E "express|axios|multer|cors" || echo "✗ Missing dependencies!"
              else
                echo "✗ node_modules NOT FOUND!"
              fi
            else
              echo "✗ Server directory NOT FOUND!"
            fi
          fi
          if [ -d "dist/mac" ]; then
            echo "Intel app found"
            APP_PATH="dist/mac/RMinte 多模态分析引擎.app/Contents/Resources/server"
            if [ -d "$APP_PATH" ]; then
              echo "✓ Server directory exists"
              if [ -d "$APP_PATH/node_modules" ]; then
                echo "✓ node_modules exists"
                ls "$APP_PATH/node_modules/" | head -10
              else
                echo "✗ node_modules NOT FOUND!"
              fi
            else
              echo "✗ Server directory NOT FOUND!"
            fi
          fi
          
        elif [ "${{ runner.os }}" = "Windows" ]; then
          echo ">>> Windows build verification <<<"
          find dist -type d -name "server" | while read serverdir; do
            echo "Found server at: $serverdir"
            ls -la "$serverdir/" | head -10
            if [ -d "$serverdir/node_modules" ]; then
              echo "✓ node_modules exists"
              ls "$serverdir/node_modules/" | head -20
            else
              echo "✗ node_modules NOT FOUND at $serverdir"
            fi
          done
          
        elif [ "${{ runner.os }}" = "Linux" ]; then
          echo ">>> Linux build verification <<<"
          find dist -type d -name "server" | while read serverdir; do
            echo "Found server at: $serverdir"
            ls -la "$serverdir/" | head -10
            if [ -d "$serverdir/node_modules" ]; then
              echo "✓ node_modules exists"
              ls "$serverdir/node_modules/" | head -20
            else
              echo "✗ node_modules NOT FOUND at $serverdir"
            fi
          done
        fi
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: electron-app-${{ matrix.os }}
        path: dist/
        
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Organize release files
      run: |
        mkdir -p release
        # Windows files
        if [ -d "electron-app-windows-latest" ]; then
          find electron-app-windows-latest -name "*.exe" -o -name "*.nsis" -o -name "*.msi" | while read file; do
            cp "$file" "release/$(basename "$file")"
          done
        fi
        # macOS files  
        if [ -d "electron-app-macos-latest" ]; then
          find electron-app-macos-latest -name "*.dmg" | while read file; do
            cp "$file" "release/$(basename "$file")"
          done
        fi
        # Linux files
        if [ -d "electron-app-ubuntu-latest" ]; then
          find electron-app-ubuntu-latest -name "*.AppImage" -o -name "*.deb" | while read file; do
            cp "$file" "release/$(basename "$file")"
          done
        fi
        ls -la release/
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
