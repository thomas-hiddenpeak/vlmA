name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*.*.*'  # 当推送版本标签时触发
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Building version $VERSION"
        # Update package.json version
        npm version $VERSION --no-git-tag-version --allow-same-version
      
    - name: Build Electron app
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Verify build output
      shell: bash
      run: |
        echo "=== Build output structure ==="
        ls -la dist/
        echo ""
        echo "=== Checking for node_modules in packaged app ==="
        if [ "${{ runner.os }}" = "macOS" ]; then
          echo "macOS build check:"
          if [ -d "dist/mac-arm64" ]; then
            ls -la "dist/mac-arm64/RMinte 多模态分析引擎.app/Contents/Resources/server/" || echo "Server directory not found"
            ls -la "dist/mac-arm64/RMinte 多模态分析引擎.app/Contents/Resources/server/node_modules/" | head -20 || echo "node_modules not found"
          fi
        elif [ "${{ runner.os }}" = "Windows" ]; then
          echo "Windows build check:"
          find dist -name "server" -type d | head -3
        elif [ "${{ runner.os }}" = "Linux" ]; then
          echo "Linux build check:"
          find dist -name "server" -type d | head -3
        fi
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: electron-app-${{ matrix.os }}
        path: dist/
        
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Organize release files
      run: |
        mkdir -p release
        # Windows files
        if [ -d "electron-app-windows-latest" ]; then
          find electron-app-windows-latest -name "*.exe" -o -name "*.nsis" -o -name "*.msi" | while read file; do
            cp "$file" "release/$(basename "$file")"
          done
        fi
        # macOS files  
        if [ -d "electron-app-macos-latest" ]; then
          find electron-app-macos-latest -name "*.dmg" | while read file; do
            cp "$file" "release/$(basename "$file")"
          done
        fi
        # Linux files
        if [ -d "electron-app-ubuntu-latest" ]; then
          find electron-app-ubuntu-latest -name "*.AppImage" -o -name "*.deb" | while read file; do
            cp "$file" "release/$(basename "$file")"
          done
        fi
        ls -la release/
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
